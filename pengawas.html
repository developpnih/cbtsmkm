<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pengawas Ruang</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pengawas.css">
</head>
<body>
<main>
<section id="lg" class="wrap">
  <form id="lf" class="card center" autocomplete="off">
    <img class="logo" alt="Logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white'%3ECBT%3C/text%3E%3C/svg%3E">
    <h1 id="sn">Panel Pengawas Ruang</h1>
    <p class="muted">Login dengan username ruang</p>
    <label>Username Ruang<input id="u" required autocapitalize="characters" placeholder="contoh: R1"></label>
    <label>Password<input id="p" type="password" required></label>
    <button class="btn">Masuk</button>
    <p id="lm" class="err"></p>
  </form>
</section>
<section id="pn" hidden>
  <header class="bar"><b>🚪 Ruang <span id="rn"></span></b><span id="ct" class="pill"></span><button class="btn ghost light sm" id="out">Keluar</button></header>
  <div class="wrap wide pw">
    <div class="row"><input id="q" placeholder="🔍 Cari nama siswa..." class="grow"><button class="btn red" id="all">🔕 Matikan Semua Alarm</button></div>
    <p class="muted" id="upd"></p>
    <div id="list"></div>
  </div>
</section>
</main>
<script src="config.js"></script>
<script src="pengawas.js"></script>
</body>
</html>
